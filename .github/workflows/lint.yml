name: PS lint

on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 1 * *'   # 1st of each month — catches PSGallery rule changes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least-privilege — no write access needed for linting

jobs:
  syntax:
    name: Syntax check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: PS AST syntax check
        shell: pwsh
        run: |
          $hasErrors = $false

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$parseErrors
            )

            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $hasErrors = $true
              $parseErrors | ForEach-Object {
                # Normalise path separators — GitHub annotations require forward slashes
                $relativePath = (Resolve-Path -Relative $_.Extent.File).TrimStart('.\').Replace('\', '/')
                Write-Output "::error file=$relativePath,line=$($_.Extent.StartLineNumber),title=Syntax Error::$($_.Message)"
              }
            }
          }

          if ($hasErrors) {
            Write-Output "::error::Syntax check failed. See annotations for details."
            exit 1
          }

          Write-Host "All PS1 files passed syntax check." -ForegroundColor Green
          "✅ Syntax check passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  analyze:
    name: PSScriptAnalyzer + cross-reference
    runs-on: windows-latest
    needs: syntax   # only runs if syntax check passes

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # ── Cache PSScriptAnalyzer ────────────────────────────────────────────────
      # Version pinned so a PSGallery update never silently changes pass/fail behavior.
      # Cache key includes version — a version bump automatically invalidates the cache.
      # To pin to a SHA: grab the commit hash from https://github.com/actions/cache/releases
      - name: Cache PSScriptAnalyzer
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: ${{ runner.os }}-psmodule-psscriptanalyzer-1.25.0

      - name: Install PSScriptAnalyzer if not cached
        shell: pwsh
        run: |
          if (!(Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            # Trust PSGallery first to prevent interactive prompts hanging the runner
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery
          } else {
            Write-Host "PSScriptAnalyzer 1.25.0 already cached." -ForegroundColor DarkGray
          }

      # ── Standard rules ────────────────────────────────────────────────────────
      # Rule exclusions are defined in PSScriptAnalyzerSettings.psd1 in the repo root.
      # That file is also picked up by VS Code + PowerShell extension for local linting
      # so local and CI rules stay identical.
      - name: PSScriptAnalyzer -- standard rules
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error `
            -Settings ./PSScriptAnalyzerSettings.psd1

          if ($results) {
            Write-Host "PSScriptAnalyzer findings ($($results.Count) total):" -ForegroundColor Yellow
            $results | ForEach-Object {
              $relativePath = (Resolve-Path -Relative $_.ScriptPath).TrimStart('.\').Replace('\', '/')
              $severity = if ($_.Severity -eq 'Error') { 'error' } else { 'warning' }
              Write-Output "::$severity file=$relativePath,line=$($_.Line),title=$($_.RuleName)::$($_.Message)"
            }
            exit 1
          }

          Write-Host "PSScriptAnalyzer standard rules passed." -ForegroundColor Green
          "✅ PSScriptAnalyzer standard rules passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ── Security rules ────────────────────────────────────────────────────────
      - name: PSScriptAnalyzer -- security rules
        shell: pwsh
        run: |
          $securityRules = @(
            'PSAvoidUsingConvertToSecureStringWithPlainText',
            'PSAvoidUsingUsernameAndPasswordParams',
            'PSAvoidUsingPlainTextForPassword',
            'PSAvoidUsingInvokeExpression',
            'PSAvoidUsingEmptyCatchBlock',
            'PSAvoidUsingCmdletAliases'
          )

          $results = Invoke-ScriptAnalyzer -Path . -Recurse `
            -IncludeRule $securityRules

          if ($results) {
            Write-Host "Security rule findings ($($results.Count) total):" -ForegroundColor Red
            $results | ForEach-Object {
              $relativePath = (Resolve-Path -Relative $_.ScriptPath).TrimStart('.\').Replace('\', '/')
              Write-Output "::error file=$relativePath,line=$($_.Line),title=Security - $($_.RuleName)::$($_.Message)"
            }
            exit 1
          }

          Write-Host "Security rules passed." -ForegroundColor Green
          "✅ Security rules passed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ── CLAUDE_TOOLS.md cross-reference ───────────────────────────────────────
      # Confirms every .ps1 in the repo root is referenced in CLAUDE_TOOLS.md.
      # Uses word boundaries (\b) to prevent partial name matches.
      - name: CLAUDE_TOOLS.md cross-reference
        shell: pwsh
        run: |
          if (!(Test-Path "CLAUDE_TOOLS.md")) {
            Write-Host "CLAUDE_TOOLS.md not found -- skipping." -ForegroundColor Yellow
            exit 0
          }

          $toolsContent = Get-Content CLAUDE_TOOLS.md -Raw

          $exempt = @(
            'push-tools-to-github.ps1'   # deprecated -- retained for historical reference only
          )

          $missing = [System.Collections.Generic.List[string]]::new()

          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            if ($_.Name -in $exempt) { return }
            # Word boundaries prevent partial matches (e.g. update.ps1 vs force-update.ps1)
            if ($toolsContent -notmatch "\b$([regex]::Escape($_.Name))\b") {
              $missing.Add($_.Name)
            }
          }

          if ($missing.Count -gt 0) {
            Write-Output "::error title=Missing Documentation::Scripts not referenced in CLAUDE_TOOLS.md"
            $missing | ForEach-Object { Write-Host "  $_" -ForegroundColor Yellow }
            Write-Host "Add these to CLAUDE_TOOLS.md or to the exempt list in lint.yml." -ForegroundColor Gray
            exit 1
          }

          $checked = (Get-ChildItem -Filter *.ps1).Count - $exempt.Count
          Write-Host "CLAUDE_TOOLS.md cross-reference passed ($checked scripts checked)." -ForegroundColor Green
          "✅ CLAUDE_TOOLS.md cross-reference passed ($checked scripts checked)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
